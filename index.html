<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E VIBES - Unstoppable Power</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .container {
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 10px;
            background: linear-gradient(90deg, #ff00ff, #00ffff, #ff00ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        .subtitle {
            font-size: 1.5rem;
            letter-spacing: 5px;
            color: #aaa;
            margin-top: 10px;
        }

        .power-bar {
            width: 300px;
            height: 10px;
            background: #222;
            margin: 30px auto;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .power-fill {
            height: 100%;
            width: 0%;
            background: #00ffff;
            box-shadow: 0 0 20px #00ffff;
            animation: charge 4s ease-in-out infinite;
        }

        @keyframes charge {
            0% { width: 0%; }
            50% { width: 100%; }
            100% { width: 100%; }
        }

        .btn {
            display: inline-block;
            padding: 15px 40px;
            margin-top: 30px;
            background: transparent;
            color: #00ffff;
            border: 2px solid #00ffff;
            text-transform: uppercase;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 2px;
            transition: 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 30px #00ffff;
        }

        .bg-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0, 255, 255, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="container">
        <h1>E VIBES</h1>
        <div class="subtitle">UNSTOPPABLE POWER</div>
        <div class="power-bar">
            <div class="power-fill"></div>
        </div>
        <button class="btn" onclick="alert('POWER SURGE DETECTED!')">Engage Power</button>
    </div>
</body>
</html>
